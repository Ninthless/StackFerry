name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v2
        with:
          runtime: node@22.12.0
          cache: true
          require-lockfile: true
      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json ${expected}"
            exit 1
          fi
      - run: pnpm test
      - run: pnpm exec vite build
      - run: pnpm exec electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Check updater manifests
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            windows-latest)
              test -f release/*/latest.yml
              ;;
            ubuntu-latest)
              test -f release/*/latest-linux.yml
              test -f release/*/latest-linux-arm64.yml
              ;;
            macos-latest)
              test -f release/*/latest-mac.yml
              ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: stackferry-${{ matrix.os }}
          path: |
            release/**/*.exe
            release/**/*.dmg
            release/**/*.AppImage
            release/**/*.yml
            release/**/*.blockmap
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: "true"
